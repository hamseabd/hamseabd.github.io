baseURL: "https://hamseabd.github.io/"
title: "Hamse Abdi"
theme: "PaperMod"
languageCode: "en-us"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Hamse Abdi"
  description: "Building production AI agents on AWS. Architecture, evals, observability, cost."
  keywords: ["AI engineer", "agentic systems", "LLM", "AWS", "evals", "production AI"]
  author: "Hamse Abdi"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false

  homeInfoParams:
    Title: "Hamse Abdi"
    Content: >
      AI Engineer building production agentic systems on AWS.

      At Travelers, I built a multi-agent underwriting system — reader agent + 11 parallel evaluators on Bedrock via Strands SDK — that replaced a 23-minute manual expert review with citation-backed approve/decline/escalate decisions. An independent LLM-as-judge rated it more accurate than the GPT-4 incumbent on 72% of 109 disagreements (n = 891 evaluations).

      Outside work, I run three deployed agents: Stride (SMS productivity coach), Apex (proactive health accountability bot), and Stock Intel (Telegram market intelligence platform).

      I write about what it takes to ship agents in production: multi-agent architecture, eval strategies that catch real bugs, LLM observability, and keeping three production systems running on $1–3/month.

      For hiring managers and engineers who care about real production AI — not demos.

  socialIcons:
    - name: github
      url: "https://github.com/hamseabd"
    - name: linkedin
      url: "https://www.linkedin.com/in/hamseabdi/"
    - name: rss
      url: "/index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
