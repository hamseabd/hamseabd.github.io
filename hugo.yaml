baseURL: "https://hamseabd.github.io/"
title: "Hamse Abdi"
theme: "PaperMod"
languageCode: "en-us"

enableRobotsTXT: true
capitalizeListTitles: false
taxonomies:
  tag: tags
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Hamse Abdi"
  description: "Hamse Abdi builds AI agents, the evals that gate them, and the platform they run on. Notes on running agents in production."
  keywords: ["AI engineer", "agentic systems", "LLM", "AWS", "evals", "production AI"]
  author: "Hamse Abdi"
  images: ["og.png"]
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false

  socialIcons:
    - name: github
      url: "https://github.com/hamseabd"
    - name: linkedin
      url: "https://www.linkedin.com/in/hamseabdi/"
    - name: rss
      url: "/index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
