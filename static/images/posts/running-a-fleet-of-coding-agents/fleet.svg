<svg xmlns="http://www.w3.org/2000/svg" width="520" height="637" viewBox="0 0 400 490" role="img" aria-labelledby="title desc">
  <title id="title">How a request moves through Bosun</title>
  <desc id="desc">I make a request in plain words. The first mate turns it into tasks, specs, and briefs. Up to three builders work at once, each with its own worktree, branch, and pull request, and a scout does read-only research. Argus reviews every pull request marked ready. A watcher written in code polls pull requests, CI, and reviews, and findings go back through the first mate for a fix round, two at most. A merge waits for my approval.</desc>
  <!-- One mid-grey palette, no background: the file is embedded as an image, so it cannot
       follow the page theme and has to read on both the light and the dark page. -->
  <style>
    .line { fill: none; stroke: #8f8f8f; stroke-width: 1; }
    .agent, .code, .head { fill: #757575; }
    .end { fill: none; stroke: #757575; stroke-width: 1.5; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7c7c7c; }
    .name { font-size: 14px; font-weight: 600; }
    .note { font-size: 13px; }
    .key { font-size: 12px; }
  </style>

  <g class="line">
    <path d="M44 19V449"/>
    <path d="M44 140H84M44 184H84M44 228H84M44 272H84"/>
    <!-- The fix round: from the watcher back up to the first mate. -->
    <path d="M38 394H30Q22 394 22 386V82Q22 74 30 74H33"/>
  </g>
  <path class="head" d="M38 74L32 70.500V77.500Z"/>

  <g class="end">
    <circle cx="44" cy="14" r="5"/>
    <circle cx="44" cy="454" r="5"/>
  </g>

  <g class="agent">
    <circle cx="44" cy="74" r="6"/>
    <circle cx="84" cy="140" r="4"/>
    <circle cx="84" cy="184" r="4"/>
    <circle cx="84" cy="228" r="4"/>
    <circle cx="84" cy="272" r="4"/>
    <circle cx="44" cy="334" r="6"/>
  </g>

  <g class="code">
    <rect x="39" y="389" width="10" height="10"/>
  </g>

  <g class="key">
    <circle class="end" cx="252" cy="14" r="4.500"/>
    <text x="262" y="18">me</text>
    <circle class="agent" cx="296" cy="14" r="5"/>
    <text x="306" y="18">agent</text>
    <rect class="code" x="353" y="9" width="10" height="10"/>
    <text x="369" y="18">code</text>
  </g>

  <g class="name">
    <text x="68" y="19">Me</text>
    <text x="68" y="79">First mate</text>
    <text x="98" y="144.500">Builder</text>
    <text x="98" y="188.500">Builder</text>
    <text x="98" y="232.500">Builder</text>
    <text x="98" y="276.500">Scout</text>
    <text x="68" y="339">Argus</text>
    <text x="68" y="399">Watcher</text>
    <text x="68" y="459">Me</text>
  </g>

  <g class="note">
    <text x="68" y="37">a request in plain words</text>
    <text x="68" y="97">turns it into tasks, specs, and briefs</text>
    <text x="98" y="162">own worktree, own branch, own pull request</text>
    <text x="98" y="206">own worktree, own branch, own pull request</text>
    <text x="98" y="250">own worktree, own branch, own pull request</text>
    <text x="98" y="294">read-only research, a short answer</text>
    <text x="68" y="357">reviews every pull request marked ready</text>
    <text x="68" y="417">polls pull requests, CI, and reviews; no tokens</text>
    <text x="68" y="477">a merge waits for my approval</text>
    <text x="14" y="234" text-anchor="middle" transform="rotate(-90 14 234)">fix round, two at most</text>
  </g>
</svg>
