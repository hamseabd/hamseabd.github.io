<svg xmlns="http://www.w3.org/2000/svg" width="520" height="377" viewBox="0 0 400 290" role="img" aria-labelledby="title desc">
  <title id="title">The feedback loop around Argus</title>
  <desc id="desc">A review posts findings. Reactions, resolved threads, and later commits are read back into a weekly feedback report. A real finding can become an eval case. The eval gates every change to the reviewer, and prompt and code changes flow back into the next review.</desc>
  <!-- One mid-grey palette, no background: the file is embedded as an image, so it cannot
       follow the page theme and has to read on both the light and the dark page. -->
  <style>
    .line { fill: none; stroke: #8f8f8f; stroke-width: 1; }
    .agent, .code, .head { fill: #757575; }
    .end { fill: none; stroke: #757575; stroke-width: 1.5; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7c7c7c; }
    .name { font-size: 14px; font-weight: 600; }
    .note { font-size: 13px; }
    .key { font-size: 12px; }
  </style>

  <g class="line">
    <path d="M44 14V69M44 79V254"/>
    <!-- Prompt and code changes: from the gate back up to the review. -->
    <path d="M38 254H30Q22 254 22 246V22Q22 14 30 14H33"/>
  </g>
  <path class="head" d="M38 14L32 10.500V17.500Z"/>

  <g class="end">
    <circle cx="44" cy="74" r="5"/>
  </g>

  <g class="agent">
    <circle cx="44" cy="14" r="6"/>
  </g>

  <g class="code">
    <rect x="39" y="129" width="10" height="10"/>
    <rect x="39" y="189" width="10" height="10"/>
    <rect x="39" y="249" width="10" height="10"/>
  </g>

  <g class="key">
    <circle class="agent" cx="296" cy="14" r="5"/>
    <text x="306" y="18">agent</text>
    <rect class="code" x="353" y="9" width="10" height="10"/>
    <text x="369" y="18">code</text>
  </g>

  <g class="name">
    <text x="68" y="19">Review</text>
    <text x="68" y="79">Reactions</text>
    <text x="68" y="139">Weekly feedback</text>
    <text x="68" y="199">Eval case</text>
    <text x="68" y="259">Gate</text>
  </g>

  <g class="note">
    <text x="68" y="37">findings posted on a pull request</text>
    <text x="68" y="97">thumbs, resolved threads, later commits</text>
    <text x="68" y="157">acted-on and false-positive rates, by specialist</text>
    <text x="68" y="217">a real finding, snapshotted and checked by hand</text>
    <text x="68" y="277">runs on every change to the reviewer</text>
    <text x="14" y="134" text-anchor="middle" transform="rotate(-90 14 134)">prompt and code changes</text>
  </g>
</svg>
